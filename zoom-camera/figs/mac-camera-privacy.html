<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><title>Mac システム設定 › プライバシーとセキュリティ › カメラ</title>

<body data-size="1100x720">
<div class="stage"><div class="win">
<aside class="side">
  <div class="lights"><span style="background:#ff5f57"></span><span style="background:#febc2e"></span><span style="background:#28c840"></span></div>
  <div class="search">🔍 検索</div>
  <div class="me"><div class="av"></div><div><b>ユーザー名</b><small>Apple Account</small></div></div>
  <div class="nav">
    <div><span class="ic" style="background:#3478f6"></span>Wi-Fi</div>
    <div><span class="ic" style="background:#3478f6"></span>Bluetooth</div>
    <div><span class="ic" style="background:#3478f6"></span>ネットワーク</div>
    <div class="gap"></div>
    <div><span class="ic" style="background:#8e8e93"></span>一般</div>
    <div><span class="ic" style="background:#3478f6"></span>アクセシビリティ</div>
    <div><span class="ic" style="background:#8e8e93"></span>コントロールセンター</div>
    <div><span class="ic" style="background:#1c1c1e"></span>Siri</div>
    <div class="sel" id="priv"><span class="ic" style="background:#2a67d6;border:1px solid rgba(255,255,255,.6)"></span>プライバシーとセキュリティ</div>
    <div class="gap"></div>
    <div><span class="ic" style="background:#3478f6"></span>デスクトップとDock</div>
    <div><span class="ic" style="background:#3478f6"></span>ディスプレイ</div>
    <div><span class="ic" style="background:#34c759"></span>スクリーンセーバ</div>
    <div><span class="ic" style="background:#ff9f0a"></span>通知</div>
    <div><span class="ic" style="background:#ff3b30"></span>サウンド</div>
  </div>
</aside>
<main class="main">
  <div class="topbar"><span class="nb">‹</span><span class="nb">›</span><h1>カメラ</h1></div>
  <div class="desc">下のアプリケーションにカメラへのアクセスを許可します。</div>
  <div class="list">
    <div class="row"><span class="ai" style="background:#4285f4"></span><span class="nm">Google Chrome</span><span class="sw"></span></div>
    <div class="row" id="zoom"><span class="ai" style="background:#2d8cff"></span><span class="nm">zoom.us</span><span class="sw off" id="zsw"></span></div>
    <div class="row"><span class="ai" style="background:#5059c9"></span><span class="nm">Microsoft Teams</span><span class="sw"></span></div>
  </div>
</main>
</div>
  <div class="mark" data-target="#priv" data-pad="5"></div>
  <div class="badge" data-target="#priv" data-at="left">1</div>
  <div class="mark" data-target="#zsw" data-pad="8" style="border-radius:20px"></div>
  <div class="badge" data-target="#zsw" data-at="right" data-dx="4">2</div>
  <div class="callout t ar" data-target="#zsw" data-at="below" data-dx="-150" data-dy="-4" style="white-space:normal;width:360px;font-size:13.5px">「zoom.us」のスイッチを<b>青（オン）</b>にする。<br>オフのままだとZoomにカメラが映らない</div>
</div>
