<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><title>Zoom 会議中のツールバー（PC）</title>
<link rel="stylesheet" href="fig-base.css">
<style>
  body{font-family:"Hiragino Sans","Yu Gothic UI","Segoe UI","Noto Sans JP",sans-serif;width:1200px;height:720px;padding:20px;color:#fff}
  .stage{width:1160px;height:680px}
  .win{position:absolute;left:0;top:0;width:1160px;height:600px;background:#1b1b1f;border-radius:12px;overflow:hidden;box-shadow:0 18px 40px rgba(0,0,0,.3)}
  .top{height:38px;background:#121214;display:flex;align-items:center;padding:0 14px;font-size:13px;color:#ccc;gap:10px}
  .shield{width:16px;height:16px;border-radius:4px;background:#2fb36f}
  .tiles{position:absolute;top:38px;left:0;right:0;bottom:84px;display:flex;align-items:center;justify-content:center;gap:16px;padding:20px}
  .tile{width:520px;height:340px;background:#2b2b31;border-radius:10px;position:relative;display:flex;align-items:center;justify-content:center}
  .tile .name{position:absolute;left:12px;bottom:10px;background:rgba(0,0,0,.55);padding:3px 10px;border-radius:6px;font-size:13px;display:flex;gap:6px;align-items:center}
  .avatar{width:120px;height:120px;border-radius:50%;background:#4a5bd6;display:flex;align-items:center;justify-content:center;font-size:44px;font-weight:700}
  .avatar.b{background:#d67a3a}
  .bar{position:absolute;left:0;right:0;bottom:0;height:84px;background:#121214;display:flex;align-items:center;padding:0 18px;gap:6px}
  .btn{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;width:88px;height:68px;border-radius:8px;font-size:12px;color:#e8e8ea;position:relative}
  .btn.split{width:106px;padding-right:18px}
  .btn .ic{width:26px;height:26px}
  .caret{position:absolute;right:6px;top:26px;width:8px;height:8px;border-left:1.5px solid #ddd;border-top:1.5px solid #ddd;transform:rotate(45deg)}
  .sep{width:1px;height:44px;background:#333;margin:0 8px}
  .end{margin-left:auto;background:#e02e2e;color:#fff;border-radius:8px;padding:9px 20px;font-size:14px;font-weight:600}
  /* popup menu */
  .menu{position:absolute;left:150px;bottom:92px;width:270px;background:#2a2a30;border:1px solid #444;border-radius:8px;padding:8px 0;font-size:13.5px;box-shadow:0 10px 30px rgba(0,0,0,.5)}
  .menu .h{color:#9a9aa3;font-size:12px;padding:4px 16px}
  .menu .i{padding:7px 16px 7px 36px;position:relative}
  .menu .i.on:before{content:"✓";position:absolute;left:16px}
  .menu .d{height:1px;background:#444;margin:6px 0}
</style></head>
<body data-size="1200x720">
<div class="stage">
  <div class="win">
    <div class="top"><span class="shield"></span>Zoom ミーティング</div>
    <div class="tiles">
      <div class="tile"><div class="avatar">あ</div><div class="name">あなた</div></div>
      <div class="tile"><div class="avatar b">講</div><div class="name">講師</div></div>
    </div>
    <div class="menu" id="menu">
      <div class="h">カメラを選択</div>
      <div class="i on" id="cam1">FaceTime HDカメラ（内蔵）</div>
      <div class="i">USB Camera</div>
      <div class="d"></div>
      <div class="i">仮想背景を選択...</div>
      <div class="i" id="vs">ビデオ設定...</div>
    </div>
    <div class="bar">
      <div class="btn split" id="mute">
        <svg class="ic" viewBox="0 0 26 26" fill="none" stroke="#e8e8ea" stroke-width="1.8"><rect x="9" y="3" width="8" height="13" rx="4"/><path d="M5 12a8 8 0 0 0 16 0M13 20v4M9 24h8"/></svg>
        ミュート<span class="caret"></span>
      </div>
      <div class="btn split" id="video">
        <svg class="ic" viewBox="0 0 26 26" fill="none" stroke="#e8e8ea" stroke-width="1.8"><rect x="3" y="7" width="14" height="12" rx="2"/><path d="M17 11l6-3v10l-6-3z"/><path d="M4 23L22 3" stroke="#ff4d4d" stroke-width="2.4"/></svg>
        ビデオの開始<span class="caret" id="vcaret"></span>
      </div>
      <div class="sep"></div>
      <div class="btn"><svg class="ic" viewBox="0 0 26 26" fill="none" stroke="#e8e8ea" stroke-width="1.8"><circle cx="10" cy="9" r="4"/><path d="M3 22c0-4 3-7 7-7s7 3 7 7M18 7a3 3 0 1 1 0 6M23 22c0-3-2-6-5-7"/></svg>参加者</div>
      <div class="btn"><svg class="ic" viewBox="0 0 26 26" fill="none" stroke="#e8e8ea" stroke-width="1.8"><path d="M4 5h18v13H9l-5 4z"/></svg>チャット</div>
      <div class="btn" style="color:#3ddc84"><svg class="ic" viewBox="0 0 26 26" fill="none" stroke="#3ddc84" stroke-width="1.8"><rect x="3" y="5" width="20" height="13" rx="2"/><path d="M13 9v6M10 12l3-3 3 3M9 22h8"/></svg>画面の共有</div>
      <div class="btn"><svg class="ic" viewBox="0 0 26 26" fill="none" stroke="#e8e8ea" stroke-width="1.8"><circle cx="13" cy="13" r="9"/><circle cx="13" cy="13" r="4" fill="#e8e8ea"/></svg>レコーディング</div>
      <div class="btn"><svg class="ic" viewBox="0 0 26 26" fill="none" stroke="#e8e8ea" stroke-width="1.8"><circle cx="13" cy="13" r="9"/><path d="M9 15c1.5 2 6.5 2 8 0M10 10h.1M16 10h.1"/></svg>リアクション</div>
      <div class="btn"><svg class="ic" viewBox="0 0 26 26" fill="#e8e8ea"><circle cx="6" cy="13" r="2"/><circle cx="13" cy="13" r="2"/><circle cx="20" cy="13" r="2"/></svg>詳細</div>
      <div class="end">終了</div>
    </div>
  </div>
  <div class="mark" data-target="#video" data-pad="4"></div>
  <div class="badge" data-target="#video" data-at="left" data-dx="-2"></div>
    <div class="callout t" data-target="#video" data-at="below" data-dy="-4" data-dx="120" style="white-space:normal;width:330px;text-align:left">赤い斜線が付いていたら<br>ここを押す → 「ビデオの開始」</div>
  <div class="mark" data-target="#menu" data-pad="6" style="border-radius:12px"></div>
  <div class="badge" data-target="#menu" data-at="right"></div>
  <div class="callout l" data-target="#menu" data-at="right" data-dy="-40" style="white-space:normal;width:300px">「^」を押すとカメラを選べる。<br>映らない時は別のカメラに切替</div>
</div>
<script src="annotate.js"></script>
<script>
  // 番号を順に振る
  document.querySelectorAll('.badge').forEach((b,i)=>b.textContent=i+1);
</script>
</body></html>
